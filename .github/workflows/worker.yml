name: Entries Worker (tests)
# Tests of the Worker in worker/ (entries of the test run). Deployment is not done here (worker/README.md).
on:
  push:
    branches: [main]
    paths: ['worker/**', 'data/testers.json', '.github/workflows/worker.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: worker
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: worker/package-lock.json
      - run: npm ci
      - run: npm test
