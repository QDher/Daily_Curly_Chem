name: Deploy GitHub Pages
# On a push to main: tests, then the site. Every day at 03:30 UTC (22:30 or 23:30 in New York, after the two daily
# sites have published) and on a manual run: the daily set is built first (tools/make_daily.js, from the problems
# of the two sites dated before that day), committed to main when it changed, then tests and the site.
on:
  push:
    branches: [main]
  schedule:
    - cron: '30 3 * * *'
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - name: Build the daily set
        if: github.event_name != 'push'
        run: |
          mkdir -p _in
          curl -fsSL https://raw.githubusercontent.com/QDher/Daily-organic-chemistry-puzzles/main/data/problems.json -o _in/onepot.json
          curl -fsSL https://raw.githubusercontent.com/QDher/Daily-name-reaction-puzzle/main/data/problems.json -o _in/namerxn.json
          node tools/make_daily.js --onepot _in/onepot.json --namerxn _in/namerxn.json --date "$(TZ=America/New_York date +%F)"
          rm -rf _in
          if [ -n "$(git status --porcelain data/daily)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data/daily
            git commit -m "Daily set $(TZ=America/New_York date +%F)"
            git push
          fi
      - run: npm test
      - name: Assemble site
        run: |
          mkdir -p _site/rdkit
          cp -r index.html src data _site/
          cp node_modules/@rdkit/rdkit/dist/RDKit_minimal.js node_modules/@rdkit/rdkit/dist/RDKit_minimal.wasm _site/rdkit/
          touch _site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
